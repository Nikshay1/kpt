# kpt live init writes the inventory to resourcegroup.yaml, and not to the
# Kptfile. A second init fails unless --force is used.
parallel: true

steps:
  - kptArgs:
      - "live"
      - "init"
    stdOut: ""
    stdErr: |
      initializing "resourcegroup.yaml" data (namespace: init)...success
    files:
      - path: Kptfile
        notContains:
          - "inventory:"
      - path: resourcegroup.yaml
        contains:
          - "kind: ResourceGroup"
          - "namespace: init"
          - "cli-utils.sigs.k8s.io/inventory-id: "

  - kptArgs:
      - "live"
      - "init"
    exitCode: 1
    stdOut: ""
    stdErr: |
      initializing "resourcegroup.yaml" data (namespace: init)...failed

      Error: Inventory information has already been added to the package ResourceGroup object. Changing it after a package has been applied to the cluster can lead to undesired results. Use the --force flag to suppress this error.

  - kptArgs:
      - "live"
      - "init"
      - "--force"
      - "--name=inventory-18030002"
    stdOut: ""
    stdErr: |
      initializing "resourcegroup.yaml" data (namespace: init)...success
    files:
      - path: resourcegroup.yaml
        contains:
          - "name: inventory-18030002"

  - kptArgs:
      - "live"
      - "init"
      - "--quiet"
      - "--force"
      - "--name=inventory-quiet"
    stdOut: ""
    stdErr: ""
    files:
      - path: resourcegroup.yaml
        contains:
          - "name: inventory-quiet"
